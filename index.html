.row{display:flex;gap:8px;align-items:center}
.big{width:100%;font-size:1.15rem;padding:15px}
.prev{display:grid;place-items:center;background:var(--card2);border-radius:14px;padding:10px;margin-bottom:12px}
.tr{display:flex;align-items:center;gap:8px;padding:4px 0}
.tr>span:first-child{flex:1;color:var(--mut);font-size:.9rem}

.tr .v{min-width:110px;text-align:center}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);vertical-align:middle}
.err{color:var(--sun);min-height:1.4em;margin:8px 0 0}
.code{font:400 2.4rem "Bagel Fat One",Rubik,sans-serif;letter-spacing:.2em;color:var(--lime)}
.pl{display:flex;align-items:center;gap:12px;padding:6px 0}

.pl .n{flex:1}

.bar .t{font-size:.92rem;min-height:2.6em;margin-bottom:8px}
.leg{font-size:.85rem;color:var(--mut);margin:8px 0 0}
.log{color:var(--mut);font-size:.9rem;margin:0;padding:0;list-style:none}
.log li{margin:2px 0}
.fo,.fi{transform-box:fill-box;transform-origin:center}
.fo{animation:fo .3s ease-in forwards}
.fi{animation:fi .4s .3s ease-out both}
@keyframes fo{to{transform:scaleX(0)}}
@keyframes fi{from{transform:scaleX(0)}60%{transform:scaleX(1.18)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.fo{display:none}.fi{animation:none}}

.ann.show{animation:annin .35s ease-out both}
.annh{font-size:.8rem;color:var(--mut);margin-bottom:2px}
.annt{font:400 1.15rem "Bagel Fat One",Rubik,sans-serif}
.annr{margin-top:6px;font-weight:600}
@keyframes annin{from{transform:translateY(-14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ann.show{animation:none}}
.sel{outline:3px solid var(--lime);outline-offset:-3px}

  const l=room.last,rk=l?l.id+':'+l.d+':'+l.cell+':'+((room.log||[])[0]||''):'';

function tick(t){
  requestAnimationFrame(tick);
  const dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;
  if(!room||room.status==='lobby'||!room.order||!$('pwl'))return;
  let mv=false,rc=false;
  room.order.forEach(id=>{const d=disp[id];if(!d)return;
    if(d.w>0){d.w-=dt;d.mv=false;mv=true;return}
    if(!d.q.length){if(d.mv){d.mv=false;mv=true}return}
    const w=d.q[0],diff=w.t-d.p,step=5*dt;
    if(Math.abs(diff)<=step){d.p=w.t;d.q.shift();d.mv=false;if(w.rev&&visRev&&!visRev.has(w.rev)){visRev.add(w.rev);rc=true;if(w.ann)announce(w.ann)}if(w.w)d.w=w.w}
    else{d.p+=Math.sign(diff)*step;d.mv=true;d.ph+=dt*14}
    mv=true;
  });
  if(rc&&!sel&&$('ev'))$('ev').innerHTML=evHtml()

}

let LOCAL=false,realDb=null,LP=[];
function makeLocalDB(h){
  h=h||{};const D={},S={};
  const cp=x=>x===undefined?x:JSON.parse(JSON.stringify(x));
  const mg=(a,b)=>{const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?mg(o[k],v):cp(v)}return o};
  const snap=p=>({exists:D[p]!==undefined,id:p.split('/').pop(),data:()=>cp(D[p])});
  const qs=p=>{const d=Object.keys(D).filter(k=>k.startsWith(p+'/')&&k.indexOf('/',p.length+1)<0).map(snap);return{docs:d,size:d.length}};
  const fire=p=>{(S[p]||[]).slice().forEach(f=>f(snap(p)));const par=p.slice(0,p.lastIndexOf('/'));(S[par]||[]).slice().forEach(f=>f(qs(par)))};
  const fireAll=()=>Object.keys(S).forEach(p=>(S[p]||[]).slice().forEach(f=>f(p.split('/').length%2===0?snap(p):qs(p))));
  const sub=(p,f)=>{(S[p]=S[p]||[]).push(f);return()=>{S[p]=S[p].filter(x=>x!==f)}};
  const write=o=>{if(o.op==='set')D[o.p]=cp(o.d);else D[o.p]=mg(D[o.p]||{},o.d);fire(o.p);if(h.after)h.after()};
  return{
    doc:p=>({get:async()=>snap(p),set:async d=>{h.client?h.send({op:'set',p,d:cp(d)}):write({op:'set',p,d})},update:async d=>{h.client?h.send({op:'update',p,d:cp(d)}):write({op:'update',p,d})},onSnapshot:f=>{const u=sub(p,f);f(snap(p));return u}}),
    collection:p=>({get:async()=>qs(p),onSnapshot:f=>{const u=sub(p,f);f(qs(p));return u}}),
    apply:write,dump:()=>cp(D),replace:docs=>{Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,cp(docs));fireAll()}
  };
}

  setMap(room.len||50);room.status==='lobby'?lobby():game();
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nm=id=>cl(players[id]).name;
function lobby(){
  const ids=Object.keys(players),host=room.host===me;
  app.innerHTML='<h1>De Quilmes a Berazategui</h1><section><p class="sub" style="margin:0">Código de la sala</p><div class="code">'+esc(code)+'</div><p class="sub" style="margin:0">Pasales este código a tus amigos.</p><p class="sub" style="margin:6px 0 0">Partida de '+(room.len||50)+' casilleros.</p></section><section><h2>En la sala ('+ids.length+'/8)</h2>'+ids.map(i=>'<div class="pl">'+avs(players[i],44)+'<span class="n">'+esc(nm(i))+(i===me&&!LOCAL?' (vos)':'')+'</span></div>').join('')+'</section>'+(host?'<button id="go" class="big" '+(ids.length<1?'disabled':'')+'>'+(ids.length<2?'Empezar solo, para probar':'Empezar la partida')+'</button>':'<p class="sub">Esperando a que el anfitrión empiece…</p>')+'<p style="margin-top:14px"><button class="alt" id="lv">Salir</button></p>';
  $('lv').onclick=home;
  if(host)$('go').onclick=()=>begin(ids);
}
function begin(ids){
  const o=shuffle(ids).slice(0,8),pos={};o.forEach(i=>pos[i]=0);
  db.doc('rooms/'+code).set({host:room.host,len:room.len||50,status:'playing',order:o,pos,skip:{},rev:{},hit:null,turn:0,log:['¡Salen de Quilmes rumbo a Berazategui!'],last:null,winner:null});
}
function evHtml(){
  if(sel){const e=EV[sel-1],rv=room.rev||{},z='<b>Casillero '+sel+' · '+ZN[zoneOf(sel)]+'</b>: ';return sel>N?z+'este tramo no se usa en esta partida.':sel===N?z+'la meta. ¡Llegá primero!':rv[sel]?z+e[2]+' ('+ICO[e[0]]+' '+evTxt(e)+')':z+'todavía nadie cayó acá: se avisa cuando llegue alguien.'}
  const l=room.last,h=room.hit,ht=h&&Date.now()-h.n<9000?'<b>🚆 ¡El tren chocó a '+esc(nm(h.id))+'!</b> Retrocede un casillero.<br>':'';
  if(!l)return ht+'Tocá un casillero para ver su problema.';
  const dc='<span style="font-size:1.7rem;vertical-align:middle">'+'⚀⚁⚂⚃⚄⚅'[l.d-1]+'</span> <b>'+esc(nm(l.id))+'</b> sacó '+l.d;
  if(l.cell<N&&!(visRev&&visRev.has(l.cell)))return ht+dc+' y camina… 🚶';
  return ht+dc+(l.t?' y cayó en '+ZN[zoneOf(l.cell)]+': '+esc(l.t):'')+' → '+esc(l.res);
}
function game(){
  gameSync();
  const o=room.order,cur=o[room.turn],mine=cur===me,done=room.status==='done';
  const by={};
  app.innerHTML='<h1>De Quilmes a Berazategui</h1><svg id="mp" viewBox="0 0 360 '+MH+'" role="img" aria-label="Mapa de Quilmes a Berazategui">'+mapStatic()+mapAnim()+'<g id="cl">'+cellsLayer()+'</g><g id="pwl"></g>'+'</svg><p class="leg">🎈 avanzás · 🕳️ retrocedés · 💤 perdés un turno · 🎲 tirás de nuevo · 🚶 casillero tranquilo . Cada casillero te avisa lo que tiene cuando llegás.</p><p class="leg">Esquema ilustrado: calles y lugares reales, posiciones aproximadas.</p><section style="margin-top:14px"><h2>Jugadores</h2>'+o.map(i=>'<div class="pl '+(i===cur&&!done?'cur':'')+'">'+avs(players[i],34)+'<span class="n">'+esc(nm(i))+(i===me&&!LOCAL?' (vos)':'')+'</span><span>'+(room.skip&&room.skip[i]?'💤 ':'')+'casillero '+room.pos[i]+'</span></div>').join('')+'</section><section><h2>Historial</h2><ul class="log">'+(room.log||[]).map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul></section><button class="alt" id="lv" style="margin-bottom:14px">Salir de la partida</button><div class="bar"><div class="t" id="ev">'+evHtml()+'</div>'+(done?'<div><b>🏆 ¡Ganó '+esc(nm(room.winner))+'!</b></div>'+((room.host===me||LOCAL)?'<button id="again" class="big" style="margin-top:8px">Jugar otra ronda</button>':''):mine?'<button id="roll" class="big">Tirar el dado'+(LOCAL?' · '+esc(nm(cur)):'')+'</button>':'<button class="big alt" disabled>Juega '+esc(nm(cur))+'…</button>')+'</div>';
  $('lv').onclick=home;
  $('mp').onclick=e=>{const g=e.target.closest('[data-n]');if(g){sel=+g.dataset.n;$('ev').innerHTML=evHtml()}};
  const rb=$('roll');if(rb)rb.onclick=()=>{if(busy)return;busy=true;sel=0;const f='⚀⚁⚂⚃⚄⚅',tm=setInterval(()=>{rb.textContent=f[Math.floor(Math.random()*6)]+' Tirando…'},90);setTimeout(()=>{clearInterval(tm);roll()},800)};
  const ag=$('again');if(ag)ag.onclick=()=>{const pos={};o.forEach(i=>pos[i]=0);db.doc('rooms/'+code).set({...room,status:'playing',pos,skip:{},rev:{},hit:null,turn:0,winner:null,last:null,log:['¡Otra ronda!']})};
  const key=room.turn+'|'+JSON.stringify(room.pos);
  if(key!==lastKey){lastKey=key;sel=0;setTimeout(()=>{const s=$('mp');if(!s)return;const rc=s.getBoundingClientRect(),y=rc.top+window.scrollY+PT[room.pos[cur]||0][1]*rc.width/360-window.innerHeight*.45;window.scrollTo({top:Math.max(0,y),behavior:'smooth'})},60)}
}
async function roll(){
  const o=room.order,id=o[room.turn];
  if(id!==me)return;busy=true;
  const d=1+Math.floor(Math.random()*6),pos={...room.pos},skip={...room.skip},rev={...(room.rev||{})},land=Math.min(pos[id]+d,N);
  let p=pos[id]+d,win=false,again=false,res='',txt='';
  if(p>=N){p=N;win=true;res='¡llegó a Berazategui!'}
  else{const e=EV[p-1];txt=e[2];
    if(e[0]==='f'){p=Math.min(N-1,p+e[1]);res='avanza '+e[1]}
    else if(e[0]==='b'){p=Math.max(0,p-e[1]);res='retrocede '+e[1]}
    else if(e[0]==='s'){skip[id]=true;res='pierde su próximo turno'}
    else if(e[0]==='r'){again=true;res='tira de nuevo'}else res='sigue tranquilo'}
  pos[id]=p;if(land<N)rev[land]=true;
  const log=[nm(id)+' sacó '+d+(txt?' · '+txt:'')+' → '+res,...(room.log||[])].slice(0,6);
  let t=(room.turn+1)%o.length;
  if(again)t=room.turn;
  else if(!win){for(let k=1;k<=o.length;k++){const n=(room.turn+k)%o.length,x=o[n];if(skip[x]){delete skip[x];log.unshift(nm(x)+' se saltea el turno 💤');continue}t=n;break}}
  const su={};Object.keys({...room.skip,...skip}).forEach(k=>su[k]=!!skip[k]);
  try{await db.doc('rooms/'+code).update({pos:{[id]:p},skip:su,rev:land<N?{[land]:true}:{},turn:t,log:log.slice(0,6),last:{id,d,cell:land,t:txt,res},status:win?'done':'playing',winner:win?id:null})}catch(e){}
  busy=false;
}
const app=$('app');
init();
</script>
